name: Security checks

on:
  pull_request:
    paths:
      - "supabase/functions/**"
      - "staff/**"
      - ".github/workflows/security-checks.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "staff/**"
      - ".github/workflows/security-checks.yml"

permissions:
  contents: read

jobs:
  invitation-auth-tests:
    name: Invitation authorization tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run invitation authorization tests
        run: deno test supabase/functions/tests/invite-staff_test.ts

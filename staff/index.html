<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Call list · Alienway Production</title><link rel="stylesheet" href="calls.css"></head>
<body><main><header><a href="../">AW / ALIENWAY PRODUCTION</a><button id="logout" hidden>Sign out</button></header>
<h1>Business call list</h1>
<p id="message" role="status"></p>
<form id="login">
  <label>Staff email<input name="email" type="email" autocomplete="username" required></label>
  <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
  <button>Sign in</button><button type="button" id="setup">Set or reset my password</button>
</form>
<form id="send" hidden>
  <label>Invited staff email<input name="email" type="email" autocomplete="email" required></label>
  <button>Email setup instructions</button><button type="button" class="cancel">Back to sign in</button>
</form>
<form id="verify" hidden>
  <p>Open the link in your email or enter the code if your message contains one.</p>
  <label>Email code<input name="token" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" required></label>
  <button>Verify code</button><button type="button" class="cancel">Back to sign in</button>
</form>
<form id="choose" hidden>
  <label>Choose a password (at least 12 characters)<input name="password" type="password" autocomplete="new-password" minlength="12" required></label>
  <button>Save password</button><button type="button" class="cancel">Cancel</button>
</form>
<section id="desk" hidden><details><summary>Add a business</summary><form id="add"><label>Business name<input name="business" maxlength="160" required></label><label>Contact number<input name="phone" type="tel" required></label><label>Business details<textarea name="details" rows="3" maxlength="2000" placeholder="Contact person, industry and what to discuss"></textarea></label><button>Save business</button></form></details>
<div class="bar"><label>Show<select id="filter"><option value="queue">To call now</option><option value="callback">All callbacks</option><option value="approved">Approved</option><option value="declined">Declined</option></select></label><button id="refresh">Refresh</button></div><div id="list"></div><button hidden id="more">Load more</button></section></main><script type="module" src="calls.js?v=password1"></script></body></html>
